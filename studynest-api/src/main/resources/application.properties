# StudyNest Application Configuration
spring.application.name=studynest-api
server.port=8080

# Database Configuration (Persistent file storage in ./data/studynestdb)
# Data will not be lost across restarts!
spring.datasource.url=jdbc:h2:file:./data/studynestdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Template Cache (disable for development)
spring.thymeleaf.cache=false
